[tool_alias]
codex = "aqua:openai/codex"
firecrawl = "npm:firecrawl-cli"
graphify = "pipx:graphifyy"
ipython = "pipx:ipython"
pake = "npm:pake-cli"
pi = "aqua:earendil-works/pi"
ruff = "aqua:astral-sh/ruff"

# may also need to set each with `mise use -g {TOOL}@lastest`
[tools]

###################################
# languages / runtimes

node = "latest"
deno = "latest"
java = "latest"
python = "latest"
ruby = "latest"
go = "latest"
rust = "latest"

###################################
# package / project managers

uv = "latest"
pnpm = "latest"

###################################
# engines

bun = "latest"

###################################
# system tools installed globally below to avoid project-level runtime-version collisions:

# aqua backend
#

# OpenAI coding agent
"codex" = "latest"

# node backend
#

# open source coding agent
"pi" = "latest"
# agent skills manager
"npm:skills" = "latest"
# firecrawl tools
"firecrawl" = "latest"
# create app wrappers for websites
"pake" = "latest"

# python / uv backend
#

# python linter (e.g. Flake8), formatter (e.g. Black), import sorter (e.g. isort), and code modernizer (e.g. pyupgrade)
"ruff" = "latest"
# enhanced interactive python REPL
"ipython" = "latest"
# interactive python debugger; NOTE: favor project-local installs or on-demand invocations (`uvx ipdb my-script.py`)
# "pipx:ipdb" = "latest"

# create queryable, LLM-friendly knowledge graph in any project (https://github.com/Graphify-Labs/graphify)
"graphify" = "latest"

[settings]

# config files with these prefixes will be trusted by default
trusted_config_paths = [
    '~/dev',
]
